<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843"/>
      <stop offset="50%" style="stop-color:#B38E2D"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Laurel wreath background -->
  <circle cx="100" cy="95" r="55" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Open book icon -->
  <path d="M75 70 C75 70, 85 65, 100 65 C115 65, 125 70, 125 70 L125 100 C125 100, 115 95, 100 95 C85 95, 75 100, 75 100 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <line x1="100" y1="65" x2="100" y2="95" stroke="white" stroke-width="2"/>
  <!-- Book pages -->
  <path d="M80 72 Q90 68, 98 68 L98 92 Q88 94, 80 97 Z" fill="white" opacity="0.3"/>
  <path d="M120 72 Q110 68, 102 68 L102 92 Q112 94, 120 97 Z" fill="white" opacity="0.3"/>
  <!-- Torch/bookmark on top -->
  <rect x="97" y="52" width="6" height="18" rx="3" fill="url(#goldGrad)"/>
  <circle cx="100" cy="50" r="5" fill="url(#goldGrad)"/>
  <!-- ZSSA text -->
  <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="url(#goldGrad)">ZSSA</text>
  <!-- Subtitle -->
  <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="url(#goldGrad)">الفريق الإجتماعي</text>
  <!-- Decorative base lines -->
  <line x1="70" y1="158" x2="130" y2="158" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="80" y1="163" x2="120" y2="163" stroke="url(#goldGrad)" stroke-width="1.5"/>
</svg>